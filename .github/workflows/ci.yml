# Runs on every push and pull request: unit tests, the truth source's tests, a check that the
# committed benchmark data reproduces every published number, and privacy guards.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install minimal dependencies
        run: pip install -r requirements-ci.txt
      - name: Privacy guard (data/private and keys are never committed)
        run: |
          if git ls-files | grep -E '^data/private/|\.key$|(^|/)\.env$' | grep -vx 'data/private/README.md'; then echo "private file tracked"; exit 1; fi
          # a 64-hex value is a possible private key unless the line marks it as a known public constant
          if git grep -nIE '0x[0-9a-fA-F]{64}\b' -- ':!*.ndjson' ':!*.json' ':!*.md' ':!*.lock' ':!package-lock.json' | grep -v 'public-constant' ; then
            echo "possible private key in source"; exit 1; fi
          # everywhere, JSON and Markdown included: key blocks and key-shaped values.
          # data/sources/osv holds verbatim public advisories, whose proofs of concept quote sample keys.
          if git grep -nIE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e 'anjoman_[A-Za-z0-9_-]{16,}' \
               -e '"(private_?key|privateKey|secret|api_?key|apiKey|builderApiKey)"[[:space:]]*:[[:space:]]*"[^"]{8,}"' \
               -e '(sk|ghp|gho|xox[bp])[-_][A-Za-z0-9]{20,}' -- ':!data/sources/osv/*'; then
            echo "possible secret committed"; exit 1; fi
      - name: Tool tests
        run: python tests/test_tools.py
      - name: Benchmark grading and statistics
        run: python tests/test_bench.py
      - name: Published numbers reproduce from committed data
        run: python tests/test_reproduce.py
      - name: Verified Ask checks and replay
        run: python tests/test_verify.py
      - name: Mind test cases and scoring
        run: python tests/test_mind.py
      - name: Truth source tests
        run: node --test truth-sources/cve-cvss/test/*.test.js
      - name: Signed evidence unchanged (tools/evidence_manifest.mjs)
        run: node tools/evidence_manifest.mjs verify
      - name: Mind connector tests (offline)
        run: node --test mind/connector/test/*.test.mjs
